name: Server Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      NuGetPackageSourceCredentials_github: Username=${{github.actor}};Password=${{secrets.GITHUB_TOKEN}}

    steps:
      # Repository
      - name: Checkout
        uses: actions/checkout@v7

      # .Net
      - name: Setup .Net
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Restore and build for the same runtime used by Publish --no-build.
      - name: Restore
        run: dotnet restore YuJanggi.Server.slnx --configfile NuGet.Config --runtime linux-x64 -p:SelfContained=false

      - name: Build
        run: dotnet build YuJanggi.Server.slnx --configuration Release --runtime linux-x64 --self-contained false --no-restore

      - name: Test
        run: dotnet test YuJanggi.Server.slnx --configuration Release --runtime linux-x64 --no-build

      # Framework-dependent Linux deployment output (requires .NET 10 runtime).
      - name: Publish
        run: >-
          dotnet publish src/YuJanggi.Server.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained false
          --no-build
          --output artifacts/publish/linux-x64

      - name: Upload Linux deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: yujanggi-server-linux-x64
          path: artifacts/publish/linux-x64/**
          if-no-files-found: error
