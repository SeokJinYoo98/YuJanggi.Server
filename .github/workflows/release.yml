name: Server Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      NuGetPackageSourceCredentials_github: Username=${{github.actor}};Password=${{secrets.GITHUB_TOKEN}}

    steps:
      # Repository
      - name: Checkout
        uses: actions/checkout@v7

      # .Net
      - name: Setup .Net
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Validate the solution using the same commands as Server CI.
      - name: Restore
        run: dotnet restore YuJanggi.Server.slnx --configfile NuGet.Config

      - name: Build
        run: dotnet build YuJanggi.Server.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test YuJanggi.Server.slnx --configuration Release --no-build

      # Framework-dependent Linux deployment output (requires .NET 10 runtime).
      # Publish restores and builds the server project for its specific runtime.
      - name: Publish
        shell: bash
        run: bash scripts/PublishServer.sh

      - name: Upload Linux deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: yujanggi-server-linux-x64
          path: artifacts/publish/linux-x64/**
          if-no-files-found: error
