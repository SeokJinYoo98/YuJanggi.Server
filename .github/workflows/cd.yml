name: Server CD

on:
  workflow_run:
    workflows: ['Server Release']
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: server-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      SERVER_DEPLOY_PATH: ${{ vars.SERVER_DEPLOY_PATH }}

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Release Artifact
        uses: actions/download-artifact@v8
        with:
          name: yujanggi-server-linux-x64
          path: artifacts/publish/linux-x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy to EC2
        shell: bash
        env:
          SSH_DIR: ${{ runner.temp }}/yujanggi-ssh
          SERVER_PRIVATE_KEY: ${{ secrets.SERVER_PRIVATE_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: bash scripts/DeployServer.sh
